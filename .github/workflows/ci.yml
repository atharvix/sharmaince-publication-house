name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nightingale
          POSTGRES_PASSWORD: nightingale
          POSTGRES_DB: nightingale_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nightingale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: cp .env.test.example .env.test
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run typecheck:tests
      # `pretest` migrates and seeds the test database before vitest runs.
      - run: npm test
      - run: npm run build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nightingale-press
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: nightingale-press/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
