# The public entry point. It only forwards to the `web` containers and is never
# restarted by a deploy, so the site's port stays open while web and api are swapped
# (see scripts/deploy.sh). Change it rarely: reloading it is the one step that
# needs `docker compose exec edge nginx -s reload`, which is still zero-downtime.
resolver 127.0.0.11 valid=2s ipv6=off;

server {
    listen 80;
    server_tokens off;
    client_max_body_size 16m;

    location / {
        # A variable makes nginx re-resolve `web`, so it follows new containers.
        set $web http://web:80;
        proxy_pass $web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A web container that is going away refuses the connection; try the other.
        # Requests that already reached a container are not retried.
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
    }
}
