services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nightingale
      POSTGRES_PASSWORD: nightingale
      POSTGRES_DB: nightingale
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nightingale']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://nightingale:nightingale@postgres:5432/nightingale?schema=public
    ports:
      - '4000:4000'
    volumes:
      - uploads_data:/app/uploads

  web:
    build:
      context: ../nightingale-press
      args:
        VITE_API_URL: http://localhost:4000/api
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  postgres_data:
  uploads_data:
